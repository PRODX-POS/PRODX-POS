name: OKMD AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: okmd-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  okmd-ai-review:
    name: OKMD AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base workflow helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Verify repository-owned pull request
        id: trust
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OKMD review is skipped for fork pull requests; no repository secret is exposed."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and sanitize pull request diff
        if: steps.trust.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github.v3.diff" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}.diff" \
            > pr.diff

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('pr.diff').read_text(encoding='utf-8', errors='replace')
          blocks = re.split(r'(?=^diff --git )', source, flags=re.MULTILINE)
          allowed = []
          excluded = []
          sensitive_name = re.compile(r'(^|/)(?:\.env(?:\..*)?|.*(?:secret|credential|password|token).*)$|\.(?:pem|key|p12|pfx)$', re.I)
          secret_patterns = [
              (re.compile(r'(Authorization:\s*Bearer\s+)[^\s]+', re.I), r'\1[REDACTED]'),
              (re.compile(r'((?:api[_-]?key|access[_-]?token|client[_-]?secret|password|secret)\s*[:=]\s*["\']?)[^\s"\'&,]+', re.I), r'\1[REDACTED]'),
              (re.compile(r'-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----', re.S), '[REDACTED_PRIVATE_KEY]'),
              (re.compile(r'(gh[pousr]_[A-Za-z0-9_]{20,})'), '[REDACTED_GITHUB_TOKEN]'),
          ]

          for block in blocks:
              if not block.strip():
                  continue
              match = re.search(r'^diff --git a/(.*?) b/(.*?)$', block, re.M)
              path = match.group(2) if match else 'unknown'
              if sensitive_name.search(path):
                  excluded.append(path)
                  continue
              cleaned = block
              for pattern, replacement in secret_patterns:
                  cleaned = pattern.sub(replacement, cleaned)
              allowed.append(cleaned)

          result = ''.join(allowed)
          if len(result.encode('utf-8')) > 120_000:
              result = result.encode('utf-8')[:120_000].decode('utf-8', errors='ignore')
              result += '\n\n[DIFF TRUNCATED AT 120KB]\n'
          if not result.strip():
              raise SystemExit('No reviewable source diff remained after sensitive-file filtering.')

          Path('sanitized.diff').write_text(result, encoding='utf-8')
          Path('excluded-files.txt').write_text('\n'.join(sorted(set(excluded))) or 'none', encoding='utf-8')
          print(f'Reviewable diff bytes: {len(result.encode("utf-8"))}')
          print(f'Excluded sensitive paths: {len(set(excluded))}')
          PY

      - name: Select OKMD model
        if: steps.trust.outputs.enabled == 'true'
        id: model
        env:
          OKMD_BASE_URL: https://gen.ai.kku.ac.th/okmd/api/v1
          OKMD_API_KEY: ${{ secrets.OKMD_AI_API_KEY }}
          PREFERRED_MODEL_ID: ${{ vars.OKMD_AI_REVIEW_MODEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OKMD_API_KEY:-}" ]]; then
            echo "OKMD_AI_API_KEY is not available to this workflow run." >&2
            exit 1
          fi

          models="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $OKMD_API_KEY" \
            --header "Accept: application/json" \
            "$OKMD_BASE_URL/models")"

          model_id="$PREFERRED_MODEL_ID"
          if [[ -z "$model_id" ]]; then
            model_id="$(printf '%s' "$models" | jq -r '.data[] | select((.owned_by // "") | test("claude-sonnet-4|gpt-5|gemini-2.5-pro"; "i")) | .id' | head -n1)"
          fi
          if [[ -z "$model_id" || "$model_id" == "null" ]]; then
            model_id="$(printf '%s' "$models" | jq -r '.data[0].id // empty')"
          fi
          if [[ -z "$model_id" ]]; then
            echo "OKMD API returned no usable model." >&2
            exit 1
          fi
          echo "model_id=$model_id" >> "$GITHUB_OUTPUT"
          printf '%s' "$models" | jq -r --arg selected "$model_id" '"OKMD advertised model count: \(.data | length)" , ("OKMD selected model: " + $selected)' >> "$GITHUB_STEP_SUMMARY"

      - name: Review diff with OKMD AI
        if: steps.trust.outputs.enabled == 'true'
        env:
          OKMD_BASE_URL: https://gen.ai.kku.ac.th/okmd/api/v1
          OKMD_API_KEY: ${{ secrets.OKMD_AI_API_KEY }}
          OKMD_MODEL_ID: ${{ steps.model.outputs.model_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          import urllib.request

          diff = Path('sanitized.diff').read_text(encoding='utf-8')
          excluded = Path('excluded-files.txt').read_text(encoding='utf-8')
          system = '''You are the independent OKMD AI security and architecture reviewer for PRODX-POS. Review only the supplied pull-request diff. Do not assume missing code is correct. Do not propose weakening tests, security controls, tenant isolation, database constraints, auditability, idempotency, offline/server-authority guarantees, or financial correctness.

Return ONLY valid JSON with this exact shape:
{"decision":"PASS|WARN|FAIL","summary":"...","findings":[{"severity":"CRITICAL|HIGH|MEDIUM|LOW","file":"path","line":0,"title":"...","reason":"...","recommendation":"..."}]}

FAIL is required for any CRITICAL or HIGH finding. WARN is allowed only when findings are MEDIUM/LOW. PASS means no actionable finding. Be conservative: a plausible security or data-integrity defect should be reported rather than ignored.

Review dimensions: authentication/session security, authorization and tenant/store/device isolation, secrets handling, SQL/migrations, concurrency and transactions, idempotency, money/VAT correctness, auditability, error handling, architecture boundaries, test coverage, and regression risk.'''
          user = f'''PR #{os.environ["PR_NUMBER"]}: {os.environ["PR_TITLE"]}
Base SHA: {os.environ["BASE_SHA"]}
Head SHA: {os.environ["HEAD_SHA"]}

Sensitive paths excluded from the diff:
{excluded}

Sanitized unified diff:
```diff
{diff}
```'''

          payload = json.dumps({
              'model': os.environ['OKMD_MODEL_ID'],
              'messages': [
                  {'role': 'system', 'content': system},
                  {'role': 'user', 'content': user},
              ],
              'temperature': 0,
              'max_tokens': 3000,
              'stream': False,
          }).encode()
          req = urllib.request.Request(
              os.environ['OKMD_BASE_URL'] + '/chat/completions',
              data=payload,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + os.environ['OKMD_API_KEY'],
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=180) as response:
              body = json.load(response)

          content = body['choices'][0]['message']['content']
          content = content.strip()
          if content.startswith('```'):
              content = content.split('\n', 1)[1]
              content = content.rsplit('```', 1)[0].strip()
          review = json.loads(content)
          if review.get('decision') not in {'PASS', 'WARN', 'FAIL'}:
              raise SystemExit('OKMD returned an invalid decision.')

          Path('okmd-review.json').write_text(json.dumps(review, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(review, indent=2, ensure_ascii=False))

          summary = review.get('summary', '')
          findings = review.get('findings', [])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('# OKMD AI Code Review\n\n')
              out.write(f'**Decision:** `{review["decision"]}`\n\n')
              out.write(summary + '\n\n')
              if findings:
                  out.write('| Severity | File | Line | Finding | Recommendation |\n|---|---|---:|---|---|\n')
                  for finding in findings:
                      def cell(value):
                          return str(value).replace('|', '\\|').replace('\n', ' ')
                      out.write(f'| {cell(finding.get("severity"))} | `{cell(finding.get("file"))}` | {cell(finding.get("line", 0))} | {cell(finding.get("title"))}: {cell(finding.get("reason"))} | {cell(finding.get("recommendation"))} |\n')
              else:
                  out.write('No actionable findings.\n')

          if review['decision'] == 'FAIL':
              raise SystemExit('OKMD AI Code Review found CRITICAL/HIGH findings.')
          PY

      - name: Post OKMD review to pull request
        if: steps.trust.outputs.enabled == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          review = json.loads(Path('okmd-review.json').read_text(encoding='utf-8'))
          decision = review['decision']
          summary = review.get('summary', '').strip()
          findings = review.get('findings', [])
          lines = [
              '<!-- prodx-okmd-review -->',
              '## OKMD AI Code Review',
              '',
              f'**Decision:** `{decision}`',
              f'**Provider:** `OKMD`',
              f'**Model:** `{os.environ["MODEL_ID"]}`',
              '',
              summary or 'No summary returned.',
          ]
          if findings:
              lines += ['', '| Severity | File | Line | Finding | Recommendation |', '|---|---|---:|---|---|']
              for f in findings:
                  def cell(v): return str(v).replace('|', '\\|').replace('\n', ' ')
                  lines.append(f'| {cell(f.get("severity"))} | `{cell(f.get("file"))}` | {cell(f.get("line", 0))} | {cell(f.get("title"))}: {cell(f.get("reason"))} | {cell(f.get("recommendation"))} |')
          body = '\n'.join(lines)
          Path('okmd-comment.json').write_text(json.dumps({'body': body}, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input okmd-comment.json --header 'Accept: application/vnd.github+json' >/dev/null
