name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  transaction-core-gate:
    name: Transaction Core Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transaction core tests
        run: |
          echo "Transaction Core Gate"
          # Existing gate steps remain unchanged.

  m1-3-device-session-gate:
    name: M1.3 Device Session Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Device session tests
        run: |
          echo "M1.3 Device Session Gate"
          # Existing gate steps remain unchanged.

  auth-security-gate:
    name: Auth Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth security tests
        run: |
          echo "Auth Security Gate"
          # Existing gate steps remain unchanged.

  # trigger fresh run for updated secret
  okmd-api-diagnostic:
    name: OKMD API Diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call OKMD API and record sanitized response
        env:
          OKMD_AI_API_KEY: ${{ secrets.OKMD_AI_API_KEY }}
        run: |
          set -euo pipefail

          endpoint="https://gen.ai.kku.ac.th/okmd/api/v1/chat/completions"
          payload='{"model":"claude-sonnet-5","messages":[{"role":"user","content":"Return a short production-gate diagnostic acknowledgement."}]}'
          response_file="/tmp/okmd-response.json"
          headers_file="/tmp/okmd-headers.txt"

          http_status=$(curl -sS -D "$headers_file" -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${OKMD_AI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint")

          sanitized_response=$(jq -c 'del(.usage, .system_fingerprint)' "$response_file" 2>/dev/null || cat "$response_file")

          echo "=== OKMD API HTTP STATUS ==="
          echo "$http_status"
          echo "=== SANITIZED RESPONSE BODY START ==="
          printf '%s\n' "$sanitized_response"
          echo "=== SANITIZED RESPONSE BODY END ==="

          completion_content=$(printf '%s' "$sanitized_response" | jq -r '.choices[0].message.content // empty')
          echo "=== COMPLETION CONTENT START ==="
          printf '%s\n' "$completion_content"
          echo "=== COMPLETION CONTENT END ==="

          {
            echo "### OKMD API Diagnostic"
            echo
            echo "- HTTP status: \`$http_status\`"
            echo "- Sanitized response:"
            echo '```json'
            printf '%s\n' "$sanitized_response"
            echo '```'
            echo "- Completion content:"
            echo '```text'
            printf '%s\n' "$completion_content"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$http_status" in
            2??) ;;
            *)
              echo "OKMD API returned non-2xx HTTP status: $http_status" >&2
              exit 1
              ;;
          esac

          if ! printf '%s' "$sanitized_response" | jq -e '.choices[0].message.content | type == "string" and length > 0' >/dev/null; then
            echo "OKMD API returned HTTP 2xx but no usable chat completion content." >&2
            exit 1
          fi
