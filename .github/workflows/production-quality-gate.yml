name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, build & backend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodx
          POSTGRES_PASSWORD: prodx_ci_password
          POSTGRES_DB: prodx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodx -d prodx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://prodx:prodx_ci_password@localhost:5432/prodx_ci
      DB_APPLICATION_NAME: prodx-pos-ci
      DB_STATEMENT_TIMEOUT_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Server type check
        run: bun run server:check

      - name: Backend contract tests
        run: bun run server:test

      - name: Apply PostgreSQL foundation migration
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file=server/backend/migrations/0001_backend_foundation.sql

      - name: Verify PostgreSQL foundation schema
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          SELECT 1 FROM organizations WHERE FALSE;
          SELECT 1 FROM stores WHERE FALSE;
          SELECT 1 FROM idempotency_keys WHERE FALSE;
          SELECT 1
          FROM information_schema.columns
          WHERE table_name = 'idempotency_keys'
            AND column_name IN ('organization_id', 'key', 'request_hash', 'status')
          GROUP BY table_name
          HAVING COUNT(*) = 4;
          SQL

      - name: Theme validation
        run: bun run theme:validate

      - name: Production build
        run: bun run build

      - name: Verify no universal demo unlock credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            "(trimmed|pinOrPassword)[^\n]*(===|!==)[[:space:]]*['\"](1234|0000|5678|1111|admin)['\"]|DEFAULT_STAFF_PINS" src; then
            echo "Universal demo unlock credential detected in source."
            exit 1
          fi

      - name: Verify no direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext."
            exit 1
          fi
