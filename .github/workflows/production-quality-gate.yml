name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, build & theme validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Theme validation
        run: bun run theme:validate

      - name: Production build
        run: bun run build

      - name: Verify no universal demo unlock credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            "(trimmed|pinOrPassword)[^\n]*(===|!==)[[:space:]]*['\"](1234|0000|5678|1111|admin)['\"]|DEFAULT_STAFF_PINS" src; then
            echo "Universal demo unlock credential detected in source."
            exit 1
          fi

      - name: Verify no direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext."
            exit 1
          fi