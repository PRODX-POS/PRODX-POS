name: OpenRouter AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: openrouter-ai-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    name: OpenRouter AI Code Review
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai-review') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          COMMENT_PR: ${{ github.event.issue.number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${EVENT_PR:-}"
          if [[ -z "$pr_number" ]]; then pr_number="${COMMENT_PR:-}"; fi
          if [[ -z "$pr_number" ]]; then pr_number="${DISPATCH_PR:-}"; fi
          [[ -n "$pr_number" ]] || { echo 'A pull-request context is required.' >&2; exit 1; }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Verify repository-owned pull request
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          head_repo="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')"
          if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'OpenRouter review is skipped for fork pull requests; no repository secret is exposed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch and sanitize pull request diff
        if: steps.trust.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github.v3.diff' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}.diff" > pr.diff
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('pr.diff').read_text(encoding='utf-8', errors='replace')
          blocks = re.split(r'(?=^diff --git )', source, flags=re.MULTILINE)
          allowed, excluded = [], []
          sensitive = re.compile(r'(^|/)(?:\.env(?:\..*)?|.*(?:secret|credential|password|token).*)$|\.(?:pem|key|p12|pfx)$', re.I)
          patterns = [
              (re.compile(r'(Authorization:\s*Bearer\s+)[^\s]+', re.I), r'\1[REDACTED]'),
              (re.compile(r'((?:api[_-]?key|access[_-]?token|client[_-]?secret|password|secret)\s*[:=]\s*["\']?)[^\s"\'&,]+', re.I), r'\1[REDACTED]'),
              (re.compile(r'-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----', re.S), '[REDACTED_PRIVATE_KEY]'),
              (re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'), '[REDACTED_GITHUB_TOKEN]'),
          ]
          for block in blocks:
            if not block.strip():
              continue
            match = re.search(r'^diff --git a/(.*?) b/(.*?)$', block, re.MULTILINE)
            path = match.group(2) if match else 'unknown'
            if sensitive.search(path):
              excluded.append(path)
              continue
            for pattern, replacement in patterns:
              block = pattern.sub(replacement, block)
            allowed.append(block)
          result = ''.join(allowed)
          raw_bytes = len(result.encode())
          if raw_bytes > 120000:
            result = result.encode()[:120000].decode('utf-8', errors='ignore') + '\n\n[DIFF TRUNCATED AT 120KB]\n'
          if not result.strip():
            raise SystemExit('No reviewable source diff remained after sensitive-file filtering.')
          Path('sanitized.diff').write_text(result, encoding='utf-8')
          Path('excluded-files.txt').write_text('\n'.join(sorted(set(excluded))) or 'none', encoding='utf-8')
          Path('diff-metadata.json').write_text(
              __import__('json').dumps({'files': len(allowed), 'bytes_before_cap': raw_bytes}, indent=2),
              encoding='utf-8',
          )
          PY
          cat diff-metadata.json >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve OpenRouter review model
        id: model
        if: steps.trust.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PREFERRED_MODEL_ID: ${{ vars.OPENROUTER_AI_REVIEW_MODEL_ID }}
          FALLBACK_MODELS: ${{ vars.OPENROUTER_AI_REVIEW_FALLBACK_MODELS }}
        run: |
          set -euo pipefail
          [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo 'OPENROUTER_API_KEY is not configured.' >&2; exit 1; }
          models="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --header "Authorization: Bearer $OPENROUTER_API_KEY" \
            --header 'Accept: application/json' \
            https://openrouter.ai/api/v1/models)"
          model_id="${PREFERRED_MODEL_ID:-openrouter/auto-beta}"
          if [[ "$model_id" != 'openrouter/auto-beta' && "$model_id" != 'openrouter/auto' ]] && ! printf '%s' "$models" | jq -e --arg id "$model_id" '.data[] | select(.id == $id)' >/dev/null; then
            echo "Configured OpenRouter review model is unavailable: $model_id" >&2
            exit 1
          fi
          invalid_fallbacks=()
          IFS=',' read -ra fallback_array <<< "${FALLBACK_MODELS:-}"
          for fallback in "${fallback_array[@]}"; do
            fallback="$(printf '%s' "$fallback" | xargs)"
            [[ -z "$fallback" ]] && continue
            if [[ "$fallback" != 'openrouter/auto-beta' && "$fallback" != 'openrouter/auto' ]] && ! printf '%s' "$models" | jq -e --arg id "$fallback" '.data[] | select(.id == $id)' >/dev/null; then
              invalid_fallbacks+=("$fallback")
            fi
          done
          if ((${#invalid_fallbacks[@]} > 0)); then
            echo "Unavailable fallback model(s): ${invalid_fallbacks[*]}" >&2
            exit 1
          fi
          echo "model_id=$model_id" >> "$GITHUB_OUTPUT"
          echo "OpenRouter advertised model count: $(printf '%s' "$models" | jq '.data | length')" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenRouter primary model: $model_id" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${FALLBACK_MODELS:-}" ]]; then
            echo 'OpenRouter fallback chain configured: yes' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'OpenRouter fallback chain configured: no; structured-output and unstructured retry paths remain enabled.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Review diff with OpenRouter
        id: review
        if: steps.trust.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_ID: ${{ steps.model.outputs.model_id }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_AI_REVIEW_FALLBACK_MODELS }}
          OPENROUTER_FREE_FALLBACK_MODEL: ${{ vars.OPENROUTER_AI_REVIEW_FREE_FALLBACK_MODEL }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          diff = Path('sanitized.diff').read_text(encoding='utf-8')
          excluded = Path('excluded-files.txt').read_text(encoding='utf-8')
          primary = os.environ['OPENROUTER_MODEL_ID'].strip()
          fallbacks = [m.strip() for m in os.environ.get('OPENROUTER_FALLBACK_MODELS', '').split(',') if m.strip()]
          candidates = []
          for model in [primary, *fallbacks]:
              if model not in candidates:
                  candidates.append(model)
          # A zero-credit account can still use OpenRouter's free router.
          # Try it only after configured paid/primary candidates fail, so normal
          # accounts retain their preferred quality and routing behavior.
          free_fallback = os.environ.get('OPENROUTER_FREE_FALLBACK_MODEL', '').strip() or 'openrouter/free'
          if free_fallback not in candidates:
              candidates.append(free_fallback)

          system = '''You are the independent security, architecture, database, CI/CD, and financial-integrity reviewer for PRODX-POS. Review only the supplied pull-request diff. Do not recommend weakening security, tenant isolation, database constraints, auditability, idempotency, offline/server-authority guarantees, authentication, authorization, or financial correctness. Return only a JSON object matching the supplied schema. FAIL is required for CRITICAL or HIGH findings. Do not put JSON inside markdown fences.'''
          user = f'''PR #{os.environ['PR_NUMBER']}
          Sensitive paths excluded:
          {excluded}

          Sanitized diff:
          ```diff
          {diff}
          ```'''
          review_schema = {
              'name': 'prodx_ai_review',
              'strict': True,
              'schema': {
                  'type': 'object',
                  'additionalProperties': False,
                  'properties': {
                      'decision': {'type': 'string', 'enum': ['PASS', 'WARN', 'FAIL']},
                      'summary': {'type': 'string'},
                      'findings': {
                          'type': 'array',
                          'items': {
                              'type': 'object',
                              'additionalProperties': False,
                              'properties': {
                                  'severity': {'type': 'string', 'enum': ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']},
                                  'file': {'type': 'string'},
                                  'line': {'type': 'integer'},
                                  'title': {'type': 'string'},
                                  'reason': {'type': 'string'},
                                  'recommendation': {'type': 'string'},
                              },
                              'required': ['severity', 'file', 'line', 'title', 'reason', 'recommendation'],
                          },
                      },
                  },
                  'required': ['decision', 'summary', 'findings'],
              },
          }

          def redact(value: str) -> str:
              try:
                  parsed = json.loads(value)
                  message = parsed.get('error', {}).get('message')
                  if isinstance(message, str):
                      return message[:400]
              except json.JSONDecodeError:
                  pass
              value = re.sub(r'Bearer\s+[^\s]+', 'Bearer [REDACTED]', value, flags=re.I)
              value = re.sub(r'(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*[^\s,;]+', r'\1=[REDACTED]', value)
              return value[:400]

          def payload(model: str, structured: bool) -> dict:
              body = {
                  'model': model,
                  'messages': [
                      {'role': 'system', 'content': system},
                      {'role': 'user', 'content': user + ("\nReturn strict JSON only." if not structured else '')},
                  ],
                  'temperature': 0,
                  'max_tokens': 6000,
                  'stream': False,
              }
              if structured:
                  # Keep the request compatible with the proven OpenRouter path.
                  # The prompt and local parser still enforce the review contract.
                  body['response_format'] = {'type': 'json_object'}
              if model == 'openrouter/auto-beta':
                  body['plugins'] = [{'id': 'auto-beta-router', 'cost_tier': 'high'}]
              elif model == 'openrouter/auto':
                  body['plugins'] = [{'id': 'auto-router', 'cost_tier': 'high'}]
              return body

          def call(body: dict):
              request = urllib.request.Request(
                  'https://openrouter.ai/api/v1/chat/completions',
                  data=json.dumps(body).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['OPENROUTER_API_KEY'],
                      'Content-Type': 'application/json',
                      'HTTP-Referer': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'],
                      'X-Title': 'PRODX-POS AI Code Review',
                      'X-OpenRouter-Metadata': 'enabled',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      return response.status, json.load(response), ''
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  return exc.code, {}, redact(detail)
              except (urllib.error.URLError, TimeoutError) as exc:
                  return 599, {}, redact(str(exc))

          def parse_review(body: dict):
              message = body.get('choices', [{}])[0].get('message', {})
              text = message.get('content')
              if isinstance(text, list):
                  text = '\n'.join(
                      item.get('text') or item.get('content')
                      for item in text
                      if isinstance(item, dict) and isinstance(item.get('text') or item.get('content'), str)
                  )
              if not isinstance(text, str) or not text.strip():
                  raise ValueError('OpenRouter response did not contain review content.')
              text = text.strip()
              if text.startswith('```'):
                  text = text.split('\n', 1)[1].rsplit('```', 1)[0].strip()
              review = json.loads(text)
              if review.get('decision') not in {'PASS', 'WARN', 'FAIL'}:
                  raise ValueError('Review decision is not PASS, WARN, or FAIL.')
              if not isinstance(review.get('summary'), str) or not isinstance(review.get('findings'), list):
                  raise ValueError('Review response failed schema validation.')
              return review

          retryable = {408, 429, 500, 502, 503, 504, 599}
          errors = []
          result = None
          result_meta = {}

          for model in candidates:
              for structured in (True, False):
                  for attempt in range(1, 4):
                      status, body, detail = call(payload(model, structured))
                      if status == 200:
                          try:
                              result = parse_review(body)
                              result_meta = {'model': body.get('model', model), 'structured': structured, 'status': status, 'attempt': attempt}
                              break
                          except (ValueError, json.JSONDecodeError) as exc:
                              errors.append({'model': model, 'structured': structured, 'status': status, 'attempt': attempt, 'error': str(exc)})
                              break
                      errors.append({'model': model, 'structured': structured, 'status': status, 'attempt': attempt, 'error': detail or 'OpenRouter request failed'})
                      if status not in retryable:
                          break
                      time.sleep(2 ** (attempt - 1))
                  if result is not None:
                      break
              if result is not None:
                  break

          if result is None:
              Path('openrouter-error.json').write_text(json.dumps({'errors': errors}, indent=2), encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('\n### OpenRouter diagnostic\n```json\n')
                  summary.write(json.dumps({'errors': errors}, indent=2)[:8000])
                  summary.write('\n```\n')
              raise SystemExit('OpenRouter review failed after structured/unstructured retry paths. See the redacted diagnostic in the job summary.')

          Path('ai-review.json').write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding='utf-8')
          Path('ai-review-meta.json').write_text(json.dumps(result_meta, indent=2), encoding='utf-8')
          print(json.dumps({'model': result_meta['model'], 'structured': result_meta['structured'], 'attempt': result_meta['attempt'], 'decision': result['decision']}))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"decision={result['decision']}\n")
          PY

      - name: Post OpenRouter failure diagnostic
        if: always() && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          diagnostic = {'message': 'OpenRouter review failed before a decision was produced.'}
          if Path('openrouter-error.json').exists():
              diagnostic = json.loads(Path('openrouter-error.json').read_text(encoding='utf-8'))
          body = '<!-- prodx-openrouter-diagnostic -->\n## OpenRouter AI Review diagnostic\n\nThe review request failed before a PASS/WARN/FAIL decision.\n\n```json\n' + json.dumps(diagnostic, indent=2)[:8000] + '\n```'
          Path('openrouter-failure-comment.json').write_text(json.dumps({'body': body}), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input openrouter-failure-comment.json --header 'Accept: application/vnd.github+json' >/dev/null

      - name: Post OpenRouter review to pull request
        if: always() && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('ai-review.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('ai-review-meta.json').read_text(encoding='utf-8'))
          lines = [
              '<!-- prodx-openrouter-review -->',
              '## PRODX-POS OpenRouter AI Code Review',
              '',
              f'**Decision:** `{review["decision"]}`',
              '**Provider:** `OpenRouter`',
              f'**Model:** `{meta.get("model", "unknown")}`',
              f'**Structured output:** `{meta.get("structured", False)}`',
              '',
              review.get('summary', 'No summary returned.'),
          ]
          findings = review.get('findings', [])
          if findings:
              lines += ['', '| Severity | File | Line | Finding | Recommendation |', '|---|---|---:|---|---|']
              for finding in findings:
                  cell = lambda value: str(value).replace('|', '\\|').replace('\n', ' ')
                  lines.append(
                      f'| {cell(finding.get("severity"))} | `{cell(finding.get("file"))}` | '
                      f'{cell(finding.get("line", 0))} | {cell(finding.get("title"))}: '
                      f'{cell(finding.get("reason"))} | {cell(finding.get("recommendation"))} |'
                  )
          Path('openrouter-comment.json').write_text(json.dumps({'body': '\n'.join(lines)}, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input openrouter-comment.json --header 'Accept: application/vnd.github+json' >/dev/null

      - name: Enforce OpenRouter decision
        if: always() && steps.review.outcome == 'success'
        run: |
          set -euo pipefail
          decision="$(jq -r '.decision' ai-review.json)"
          case "$decision" in
            PASS|WARN) echo "OpenRouter decision: $decision" ;;
            FAIL) echo 'OpenRouter AI review found CRITICAL/HIGH findings.' >&2; exit 1 ;;
            *) echo 'Invalid OpenRouter decision.' >&2; exit 1 ;;
          esac
