name: One-time Quick-Pay Security Fix

on:
  push:
    branches: [ai-openai-provider-boundary]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'chore(security): enforce persisted manager PIN only'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove universal Quick-Pay PIN bypass
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/modules/pos/QuickPayDrawer.tsx')
          text = path.read_text(encoding='utf-8')

          old = """    // Check admin (1234), manager (5678), or stored manager staff pins\n    const isMasterMatch = trimmed === '5678' || trimmed === '1234';\n    const isStaffManagerMatch = staffUsers?.some(\n      (u) => (u.role === 'manager' || u.role === 'admin') && getStaffPin(u.id) === trimmed\n    );\n\n    if (isMasterMatch || isStaffManagerMatch) {"""
          new = """    // Only persisted, role-scoped manager credentials are accepted.\n    const isStaffManagerMatch = staffUsers?.some(\n      (u) => (u.role === 'manager' || u.role === 'admin') && getStaffPin(u.id) === trimmed\n    );\n\n    if (isStaffManagerMatch) {"""
          if old not in text:
              raise SystemExit('Expected Quick-Pay PIN bypass block was not found.')
          text = text.replace(old, new, 1)

          old_error = """        language === 'th'\n          ? 'รหัส PIN ผู้จัดการไม่ถูกต้อง (ทดสอบ: 5678)'\n          : 'Invalid Manager PIN (Demo hint: 5678)'"""
          new_error = """        language === 'th'\n          ? 'รหัส PIN ผู้จัดการไม่ถูกต้อง'\n          : 'Invalid Manager PIN'"""
          if old_error not in text:
              raise SystemExit('Expected Quick-Pay demo PIN hint was not found.')
          text = text.replace(old_error, new_error, 1)
          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-quickpay-security-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/pos/QuickPayDrawer.tsx .github/workflows/one-time-quickpay-security-fix.yml
          git commit -m 'chore(security): enforce persisted manager PIN only'
          git push
