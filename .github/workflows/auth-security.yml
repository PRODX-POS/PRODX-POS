name: Auth Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Server AI boundary type check
        run: npm run server:check

      - name: Server AI provider contract tests
        run: npm run server:test

      - name: Production build
        run: npm run build

      - name: Reject direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
            "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext. Use authApiFactory instead."
            exit 1
          fi

      - name: Reject hard-coded authentication fallbacks
        shell: bash
        run: |
          set -euo pipefail

          # Only scan production authentication paths. mockAdapter.ts is explicitly
          # documented as a non-production frontend test boundary.
          auth_files=(
            src/domain/auth.ts
            src/context/AuthContext.tsx
            src/adapters/authApi.ts
            src/adapters/authApiFactory.ts
          )

          forbidden_patterns=(
            "DEFAULT_STAFF_PINS"
            "=== '1234'"
            "=== '5678'"
            "=== '0000'"
            "=== '1111'"
            "== '1234'"
            "== '5678'"
            "== '0000'"
            "== '1111'"
            "return '1234'"
            "return '5678'"
            "return '0000'"
            "return '1111'"
          )

          for pattern in "${forbidden_patterns[@]}"; do
            if grep -n -F -- "$pattern" "${auth_files[@]}"; then
              echo "Hard-coded authentication credential fallback detected: $pattern"
              exit 1
            fi
          done

      - name: Reject committed provider secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --exclude='.env.example' --exclude-dir='.git' \
            'OKMD_AI_API_KEY[[:space:]]*=[[:space:]]*["'"'"']?Sk_' .; then
            echo "Potential OKMD provider secret committed to the repository."
            exit 1
          fi
          if grep -R -n -E --exclude-dir='.git' 'Sk_[A-Za-z0-9]+' server src; then
            echo "Potential provider API key literal detected in source."
            exit 1
          fi
