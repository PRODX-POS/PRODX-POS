name: Auth Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  auth-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Reject direct mock auth wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.ts' --include='*.tsx' \
            "from '../adapters/mockAdapter'" src/context/AuthContext.tsx; then
            echo "Direct mock authentication import detected in AuthContext. Use authApiFactory instead."
            exit 1
          fi

      - name: Reject universal demo unlock credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.ts' --include='*.tsx' \
            "(trimmed|pinOrPassword)[^\n]*(===|!==)[[:space:]]*['\"](1234|0000|5678|1111|admin)['\"]|DEFAULT_STAFF_PINS" src; then
            echo "Universal demo unlock credential detected in source."
            exit 1
          fi
