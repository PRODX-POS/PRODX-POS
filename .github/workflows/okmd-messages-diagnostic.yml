name: OKMD Messages Diagnostic

on:
  push:
    branches:
      - test/okmd-direct-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  okmd-messages-diagnostic:
    name: okmd-messages-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      OKMD_MESSAGES_URL: https://gen.ai.kku.ac.th/okmd/api/v1/messages
      OKMD_MODEL: claude-sonnet-5
    steps:
      - name: Test Anthropic-compatible messages completion
        shell: bash
        env:
          OKMD_AI_API_KEY: ${{ secrets.OKMD_AI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OKMD_AI_API_KEY"

          request_body=$(mktemp)
          response_body=$(mktemp)
          trap 'rm -f "$request_body" "$response_body"' EXIT

          jq -n \
            --arg model "$OKMD_MODEL" \
            '{model:$model,max_tokens:100,messages:[{role:"user",content:"Hello"}]}' \
            > "$request_body"

          echo "=== OKMD /messages REQUEST BODY ==="
          cat "$request_body"

          http_status=$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --request POST "$OKMD_MESSAGES_URL" \
            --header "Authorization: Bearer $OKMD_AI_API_KEY" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --data-binary "@$request_body" \
            --output "$response_body" \
            --write-out '%{http_code}')

          sanitized_response=$(jq -c 'del(.usage)' "$response_body" 2>/dev/null || cat "$response_body")
          sanitized_response=$(printf '%s' "$sanitized_response" | sed -E 's/(Bearer[[:space:]]+)[^[:space:]\"'"'"']+/\1[REDACTED]/Ig; s/((api[_-]?key|authorization|token)[[:space:]]*[:=][[:space:]]*[\"'"'"']?)[^,}\"'"'"']+/\1[REDACTED]/Ig')

          echo "=== OKMD /messages HTTP STATUS ==="
          echo "$http_status"
          echo "=== OKMD /messages SANITIZED RESPONSE BODY START ==="
          printf '%s\n' "$sanitized_response"
          echo "=== OKMD /messages SANITIZED RESPONSE BODY END ==="

          case "$http_status" in
            2??) ;;
            *)
              echo "OKMD /messages diagnostic failed with HTTP status $http_status."
              exit 1
              ;;
          esac

          if ! printf '%s' "$sanitized_response" | jq -e '(.content | type == "array" and length > 0) or (.choices[0].message.content | type == "string" and length > 0)' >/dev/null 2>&1; then
            echo "OKMD /messages returned HTTP 2xx but no usable completion content."
            exit 1
          fi

          echo "OKMD Anthropic-compatible messages execution evidence PASS." 
