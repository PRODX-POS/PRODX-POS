name: AI Provider Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Test AI Providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test OpenRouter (Priority 1)
        id: openrouter
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" ]]; then echo 'OPENROUTER: MISSING'; exit 1; fi
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"model":"openrouter/free","messages":[{"role":"user","content":"Reply only OK"}],"max_tokens":8}')"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [[ "$status" == "200" ]] && printf '%s' "$body" | jq -e '.choices | length > 0' >/dev/null; then
            echo 'OPENROUTER: PASS'
            echo 'OPENROUTER=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OPENROUTER: FAIL (HTTP $status)"
            printf '%s' "$body" | jq -c '{error, message}' 2>/dev/null || true
            echo 'OPENROUTER=FAIL' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test Gemini (Priority 2)
        id: gemini
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" ]]; then echo 'GEMINI: MISSING'; exit 1; fi
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent' \
            -H "x-goog-api-key: $API_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"contents":[{"parts":[{"text":"Reply only OK"}]}],"generationConfig":{"maxOutputTokens":8}}')"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [[ "$status" == "200" ]] && printf '%s' "$body" | jq -e '.candidates | length > 0' >/dev/null; then
            echo 'GEMINI: PASS'
            echo 'GEMINI=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GEMINI: FAIL (HTTP $status)"
            printf '%s' "$body" | jq -c '{error}' 2>/dev/null || true
            echo 'GEMINI=FAIL' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test Groq (Priority 3)
        id: groq
        env:
          API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" ]]; then echo 'GROQ: MISSING'; exit 1; fi
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $API_KEY")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [[ "$status" == "200" ]] && printf '%s' "$body" | jq -e '.data | length > 0' >/dev/null; then
            echo 'GROQ: PASS'
            echo 'GROQ=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GROQ: FAIL (HTTP $status)"
            printf '%s' "$body" | jq -c '{error}' 2>/dev/null || true
            echo 'GROQ=FAIL' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
