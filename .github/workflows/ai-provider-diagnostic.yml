name: OpenRouter AI Provider Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Test OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test OpenRouter API
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_ID: ${{ vars.OPENROUTER_AI_REVIEW_MODEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "${API_KEY:-}" ]] || { echo 'OPENROUTER_API_KEY: MISSING'; exit 1; }
          model="${MODEL_ID:-openrouter/free}"
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H 'Content-Type: application/json' \
            -H "HTTP-Referer: https://github.com/${GITHUB_REPOSITORY}" \
            -H 'X-Title: PRODX-POS OpenRouter Diagnostic' \
            --data "$(jq -n --arg model "$model" '{model:$model,messages:[{role:"user",content:"Reply only OK"}],temperature:0,max_tokens:8,stream:false}')")"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [[ "$status" == "200" ]] && printf '%s' "$body" | jq -e '.choices | length > 0' >/dev/null; then
            echo 'OPENROUTER: PASS'
            printf '%s' "$body" | jq -c '{model,provider,usage}'
            echo 'OPENROUTER=PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OPENROUTER: FAIL (HTTP $status)"
            printf '%s' "$body" | jq -c '{error}' 2>/dev/null || true
            echo 'OPENROUTER=FAIL' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
