name: Antigravity Gemini AI Code Review

on:
  push:
    branches:
      - chore/antigravity-gemini-ai-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          test -n "$pr"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          echo "GEMINI_API_KEY configured"

      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version

      - name: Configure Gemini provider
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini/antigravity-cli"
          printf '%s\n' '{"modelProvider":"gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: List Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          agy models

      - name: Gemini smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          output="$(agy --model gemini-3.8-flash-low --mode plan --sandbox --output-format json --print-timeout 3m -p 'Reply only with OK.')"
          echo "$output" | jq -e '.status == "SUCCESS"' >/dev/null
          echo "$output" | jq -e '.response | contains("OK")' >/dev/null

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$REPO" > pr.diff
          test -s pr.diff
          wc -c pr.diff
