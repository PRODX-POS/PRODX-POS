name: Antigravity Gemini AI Code Review

on:
  push:
    branches:
      - chore/antigravity-gemini-ai-review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          echo "GEMINI_API_KEY configured"

      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          agy --version

      - name: Configure Gemini API provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini/antigravity-cli"
          printf '%s\n' '{"modelProvider":"gemini","model":"gemini-2.5-flash"}' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: List Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          agy models

      - name: Gemini smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          agy --model gemini-3.5-flash --mode plan --sandbox --output-format json --print-timeout 3m -p 'Reply only with OK.' > agy-smoke.json
          jq -e '.status == "SUCCESS"' agy-smoke.json >/dev/null
          echo "ANTIGRAVITY_GEMINI=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$REPO" > pr.diff
          test -s pr.diff
          wc -c pr.diff >> "$GITHUB_STEP_SUMMARY"
