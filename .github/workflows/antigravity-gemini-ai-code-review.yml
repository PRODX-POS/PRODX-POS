name: Antigravity Gemini AI Code Review

on:
  push:
    branches:
      - chore/antigravity-gemini-ai-review
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          if [ -n "${PR_EVENT_NUMBER:-}" ]; then
            pr="$PR_EVENT_NUMBER"
          else
            pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          fi
          test -n "$pr"
          head_repo="$(gh pr view "$pr" --repo "$REPO" --json headRepositoryOwner --jq '.headRepositoryOwner.login')/$(gh pr view "$pr" --repo "$REPO" --json headRepository --jq '.headRepository.name')"
          test "$head_repo" = "$REPO"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          echo "GEMINI_API_KEY configured"

      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version

      - name: Configure Gemini provider
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gemini/antigravity-cli"
          printf '%s\n' '{"modelProvider":"gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: List Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          agy models

      - name: Gemini smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          output="$(agy --model gemini-3.8-flash-low --mode plan --sandbox --output-format json --print-timeout 3m -p 'Reply only with OK.')"
          echo "$output" | jq -e '.status == "SUCCESS"' >/dev/null
          echo "$output" | jq -e '.response | contains("OK")' >/dev/null

      - name: Fetch and sanitize PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$REPO" > pr.diff
          test -s pr.diff
          # Review only source/config diffs; never execute or checkout PR code.
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("pr.diff")
          s = p.read_text(errors="replace")
          s = re.sub(r'(?i)(api[_-]?key|token|secret|password|authorization)(\s*[:=]\s*)[^\s\n]+', r'\1\2[REDACTED]', s)
          s = re.sub(r'(?i)-----BEGIN [^-]+-----.*?-----END [^-]+-----', '[REDACTED_PRIVATE_KEY]', s, flags=re.S)
          max_bytes = 120000
          if len(s.encode()) > max_bytes:
              s = s.encode()[:max_bytes].decode("utf-8", "ignore") + "\n[DIFF_TRUNCATED]\n"
          Path("pr.diff.sanitized").write_text(s)
          PY
          wc -c pr.diff.sanitized

      - name: Run production review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          cat > prompt.txt <<'EOF'
          You are the adversarial production reviewer for PRODX POS, a retail POS system.
          Review ONLY the supplied sanitized unified diff. Do not assume tests passed unless the diff proves it.
          Focus on financial integrity, inventory integrity, server authority, authentication/authorization,
          auditability, idempotency/race conditions, offline sync correctness, PostgreSQL transaction boundaries,
          secrets/security, API wiring, error handling, observability, and regression risk.

          Return ONLY valid JSON with this exact shape:
          {"verdict":"PASS|WARN|FAIL","summary":"...","findings":[{"severity":"P0|P1|P2|P3","file":"...","line":"...","issue":"...","evidence":"...","recommendation":"..."}]}
          Use FAIL for any release-blocking correctness/security issue, WARN for non-blocking concerns,
          and PASS only when no material issue is found. Do not invent files, lines, behavior, or test results.
          EOF
          printf '\n--- SANITIZED PR DIFF ---\n' >> prompt.txt
          cat pr.diff.sanitized >> prompt.txt
          cat > review-schema.json <<'EOF'
          {
            "type":"object",
            "additionalProperties":false,
            "required":["verdict","summary","findings"],
            "properties":{
              "verdict":{"type":"string","enum":["PASS","WARN","FAIL"]},
              "summary":{"type":"string"},
              "findings":{
                "type":"array",
                "items":{
                  "type":"object",
                  "additionalProperties":false,
                  "required":["severity","file","line","issue","evidence","recommendation"],
                  "properties":{
                    "severity":{"type":"string","enum":["P0","P1","P2","P3"]},
                    "file":{"type":"string"},
                    "line":{"type":"string"},
                    "issue":{"type":"string"},
                    "evidence":{"type":"string"},
                    "recommendation":{"type":"string"}
                  }
                }
              }
            }
          }
          EOF
          set +e
          output="$(agy --model gemini-3.8-flash-low --mode plan --sandbox --output-format json --json-schema review-schema.json --print-timeout 15m -p "$(cat prompt.txt)")"
          agy_exit=$?
          set -e
          echo "$output" > agy-output.json
          test -n "$output"
          if echo "$output" | jq -e '.structured_output | type == "object"' >/dev/null 2>&1; then
            echo "$output" | jq '.structured_output' > review.json
          else
            echo "$output" | jq -r '.response' > review.json
          fi
          jq -e 'type == "object" and (.verdict == "PASS" or .verdict == "WARN" or .verdict == "FAIL") and (.findings | type == "array")' review.json >/dev/null
          jq . review.json
          # A non-zero agy exit is acceptable only when a complete schema-valid review was returned.
          test "$agy_exit" -eq 0 || echo "Antigravity returned non-zero with a valid structured review; preserving the review result."

      - name: Publish review to PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' review.json)"
          summary="$(jq -r '.summary' review.json)"
          {
            echo "## Antigravity Gemini Production Review"
            echo
            echo "**Verdict:** $verdict"
            echo
            echo "$summary"
            echo
            echo "### Findings"
            jq -r 'if (.findings|length)==0 then "No findings." else (.findings[] | "- **[" + .severity + "]** " + .file + (if .line then ":" + .line else "" end) + " — " + .issue + "\n  - Evidence: " + .evidence + "\n  - Recommendation: " + .recommendation) end' review.json
            echo
            echo "_Reviewed with Antigravity CLI + Gemini 3.8 Flash Low; diff was sanitized and size-capped._"
          } > review-comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file review-comment.md
          test "$verdict" != "FAIL"
