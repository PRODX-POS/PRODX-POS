name: Antigravity Gemini Provider Diagnostic

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  diagnostic:
    name: Test Gemini through Antigravity CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          agy --version

      - name: Configure Gemini API provider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${GEMINI_API_KEY:-}" ]] || { echo 'GEMINI_API_KEY: MISSING'; exit 1; }
          mkdir -p "$HOME/.gemini/antigravity-cli"
          printf '%s\n' '{"modelProvider":"gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"

      - name: Probe model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          output="$(agy --mode plan --sandbox --output-format json --print-timeout 3m -p 'Reply only with OK.')"
          echo "$output" | jq -e '.status == "SUCCESS"' >/dev/null
          echo "$output" | jq -e '.response | contains("OK")' >/dev/null
          echo 'ANTIGRAVITY_GEMINI=PASS' >> "$GITHUB_STEP_SUMMARY"
